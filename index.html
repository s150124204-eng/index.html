<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Bento Widget - Pure CSS Patrick</title>

<!-- Google Font Nunito -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --text-main: #6d5061;
        --text-sub: #7f6573;
        --pink-button: #ff8db5;
        --white-glass: rgba(255, 255, 255, 0.4);
        --white-inner: rgba(255, 255, 255, 0.65);
        --shadow: 0 10px 30px rgba(0,0,0,0.08);
        
        /* Warna Patrick */
        --pat-skin: #ff9ebb;
        --pat-pants: #b5f542;
        --pat-flower: #7b42f5;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Nunito', system-ui, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #ffdce7, #ffeef4, #fff3ce, #e2f0ff);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        overflow: hidden;
        position: relative;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Frame Utama */
    .widget {
        width: 880px;
        height: 520px;
        border-radius: 40px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background: rgba(255,255,255,0.2);
        padding: 25px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        border: 2px solid rgba(255,255,255,0.5);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        z-index: 5;
        opacity: 0;
        transform: translateY(20px) scale(0.98);
        animation: framePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
    }

    @keyframes framePop {
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Card Style */
    .card {
        background: var(--white-glass);
        border-radius: 30px;
        padding: 25px;
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.6);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: translateY(-4px);
    }

    .title {
        font-weight: 800;
        margin-bottom: 15px;
        font-size: 20px;
        color: var(--text-main);
    }

    /* Kiri: Daily Widget */
    .daily-card { justify-content: space-between; }
    .clock { font-size: 75px; font-weight: 800; color: #553848; line-height: 1; letter-spacing: -2px; }
    .date { margin-top: 8px; color: var(--text-sub); font-weight: 600; }
    .weather {
        margin-top: 25px;
        padding: 18px;
        border-radius: 20px;
        background: var(--white-inner);
    }
    .temp { font-size: 45px; font-weight: 800; color: var(--text-main); }

    /* Kanan Panel */
    .right-panel { display: flex; flex-direction: column; gap: 25px; }

    /* Spotify */
    .spotify { display: flex; gap: 20px; align-items: center; }
    .album {
        width: 90px;
        height: 90px;
        border-radius: 22px;
        background: linear-gradient(135deg, #ffc8d8, #ff9ebc);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        box-shadow: 0 8px 15px rgba(255, 141, 181, 0.3);
        animation: floatHeadphone 3s ease-in-out infinite alternate;
    }
    @keyframes floatHeadphone { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
    .song { font-size: 19px; font-weight: 700; color: var(--text-main); }
    .artist { margin-top: 4px; color: gray; font-size: 14px; }

    /* Buttons */
    .loginButton {
        margin-top: 12px;
        padding: 10px 20px;
        border: none;
        border-radius: 50px;
        background: var(--pink-button);
        color: white;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        box-shadow: 0 4px 12px rgba(255, 141, 181, 0.4);
        transition: all 0.2s;
    }
    .loginButton:hover { background: #ff6c9c; transform: scale(1.03); }

    /* Calendar */
    .calendar-card { flex: 1; justify-content: space-between; }
    .calendar-content { height: 100px; overflow-y: auto; }
    .event { background: var(--white-inner); padding: 12px 15px; border-radius: 15px; }
    .time { font-size: 12px; color: #ff6c9c; font-weight: 800; }
    .eventTitle { font-weight: 600; margin-top: 3px; font-size: 14px; color: var(--text-main); }


    /* ===================================================
       PURE CSS ANIMATED PATRICK STAR (MURNI KODINGAN)
       =================================================== */
    .patrick-container {
        position: absolute;
        bottom: 30px;
        right: 45px;
        width: 120px;
        height: 160px;
        z-index: 20;
        pointer-events: none;
        /* Animasi melompat kegirangan */
        animation: patrickJump 3s ease-in-out infinite;
    }

    /* Tubuh Utama Segitiga Bintang Bulat */
    .pat-body {
        position: relative;
        width: 100px;
        height: 130px;
        background: var(--pat-skin);
        border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
    }

    /* Kepala Mengerucut Atas */
    .pat-body::before {
        content: '';
        position: absolute;
        top: -25px;
        left: 20px;
        width: 60px;
        height: 70px;
        background: var(--pat-skin);
        border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
    }

    /* Mata Kiri & Kanan */
    .pat-eyes {
        position: absolute;
        top: 15px;
        left: 30px;
        display: flex;
        gap: 6px;
        z-index: 5;
    }

    .pat-eye {
        width: 18px;
        height: 26px;
        background: white;
        border-radius: 50%;
        position: relative;
        border: 1px solid rgba(0,0,0,0.05);
    }

    /* Pupil Mata Hitam */
    .pat-eye::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 5px;
        width: 6px;
        height: 8px;
        background: #000;
        border-radius: 50%;
    }

    /* Alis Mata Lengkung */
    .pat-eyebrows {
        position: absolute;
        top: 5px;
        left: 32px;
        width: 40px;
        display: flex;
        justify-content: space-between;
        z-index: 6;
    }
    .pat-eyebrow {
        width: 10px;
        height: 4px;
        background: #5c3821;
        border-radius: 2px;
    }
    .pat-eyebrow.left { transform: rotate(-15deg); }
    .pat-eyebrow.right { transform: rotate(15deg); }

    /* Mulut Senyum Lebar */
    .pat-mouth {
        position: absolute;
        top: 42px;
        left: 38px;
        width: 28px;
        height: 22px;
        background: #801c34;
        border-radius: 2px 2px 15px 15px;
        z-index: 5;
        overflow: hidden;
    }
    /* Lidah di dalam mulut */
    .pat-mouth::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 4px;
        width: 20px;
        height: 12px;
        background: #ff6b8b;
        border-radius: 50%;
    }

    /* Tangan Kiri (Melambaikan Bergerak) */
    .pat-arm-left {
        position: absolute;
        top: 50px;
        left: -20px;
        width: 35px;
        height: 25px;
        background: var(--pat-skin);
        border-radius: 20px 10px 10px 20px;
        transform-origin: right center;
        /* Animasi tangan dadah-dadah */
        animation: patWave 0.8s ease-in-out infinite alternate;
    }

    /* Tangan Kanan Santai */
    .pat-arm-right {
        position: absolute;
        top: 50px;
        right: -20px;
        width: 35px;
        height: 25px;
        background: var(--pat-skin);
        border-radius: 10px 20px 20px 10px;
    }

    /* Celana Hijau Ikonik */
    .pat-pants {
        position: absolute;
        bottom: 0;
        left: 2px;
        width: 96px;
        height: 40px;
        background: var(--pat-pants);
        border-radius: 0 0 25px 25px;
        border-top: 4px solid #99cf30;
        overflow: hidden;
        z-index: 4;
    }

    /* Pola Bunga Ungu di Celana */
    .pat-flower {
        position: absolute;
        background: var(--pat-flower);
        border-radius: 50%;
        opacity: 0.6;
    }
    .f1 { width: 15px; height: 15px; top: 15px; left: 15px; box-shadow: 8px 0 0 var(--pat-flower), -4px 6px 0 var(--pat-flower); }
    .f2 { width: 18px; height: 18px; top: 5px; right: 20px; box-shadow: -6px 4px 0 var(--pat-flower); }

    /* Kaki Pendek Bulat */
    .pat-legs {
        position: absolute;
        bottom: -20px;
        left: 10px;
        width: 80px;
        display: flex;
        justify-content: space-between;
    }
    .pat-leg {
        width: 26px;
        height: 28px;
        background: var(--pat-skin);
        border-radius: 0 0 12px 12px;
    }

    /* --- ANIMASI TIMING CSS --- */
    @keyframes patrickJump {
        0%, 100% {
            transform: translateY(0) scale(1) rotate(0deg);
        }
        30% {
            transform: translateY(-25px) scale(1.02) rotate(5deg);
        }
        50% {
            transform: translateY(0px) scale(0.95) rotate(-3deg);
        }
        75% {
            transform: translateY(-15px) scale(1) rotate(2deg);
        }
    }

    @keyframes patWave {
        0% { transform: rotate(15deg); }
        100% { transform: rotate(-30deg); }
    }
</style>
</head>

<body>

<!-- MASKOT PATRICK STAR MURNI CSS (TANPA FILE GAMBAR) -->
<div class="patrick-container">
    <div class="pat-body">
        <div class="pat-eyebrows">
            <div class="pat-eyebrow left"></div>
            <div class="pat-eyebrow right"></div>
        </div>
        <div class="pat-eyes">
            <div class="pat-eye"></div>
            <div class="pat-eye"></div>
        </div>
        <div class="pat-mouth"></div>
        <div class="pat-arm-left"></div>
        <div class="pat-arm-right"></div>
        <div class="pat-pants">
            <div class="pat-flower f1"></div>
            <div class="pat-flower f2"></div>
        </div>
        <div class="pat-legs">
            <div class="pat-leg"></div>
            <div class="pat-leg"></div>
        </div>
    </div>
</div>

<div class="widget">

    <!-- PANEL KIRI: Daily Widget (Sesuai Struktur Asli) -->
    <div class="card daily-card">
        <div>
            <div class="title">🌸 Daily Widget</div>
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">Loading...</div>
        </div>

        <div class="weather">
            <div class="temp">28°</div>
            <div style="font-weight: 700; color: var(--text-main); margin-top: 5px;">☀️ Surabaya</div>
        </div>
    </div>

    <!-- PANEL KANAN: Spotify & Google Calendar -->
    <div class="right-panel">
        
        <!-- Card Spotify (Sesuai Struktur Asli) -->
        <div class="card">
            <div class="title">🎵 Spotify</div>
            <div class="spotify">
                <div class="album">🎧</div>
                <div>
                    <div class="song" id="song">Belum terhubung</div>
                    <div class="artist" id="artist">Login Spotify dulu</div>
                    <button class="loginButton" onclick="spotifyLogin()">Connect Spotify</button>
                </div>
            </div>
        </div>

        <!-- Card Calendar -->
        <div class="card calendar-card">
            <div>
                <div class="title">📅 Google Calendar</div>
                <div class="calendar-content" id="calendar">
                    <div class="event">
                        <div class="time">09:00</div>
                        <div class="eventTitle">Belum ada kalender terhubung</div>
                    </div>
                </div>
            </div>
            <div style="text-align: right;">
                <button class="loginButton" onclick="googleLogin()">Connect Calendar</button>
            </div>
        </div>

    </div>

</div>

<script>
    // Fungsi Jam Realtime
    function updateClock(){
        let now = new Date();
        let time = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
        let date = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        document.getElementById('clock').innerText = time;
        document.getElementById('date').innerText = date;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function spotifyLogin(){ alert("Spotify API belum dipasang.\nNanti akan diarahkan ke login Spotify"); }
    function googleLogin(){ alert("Google Calendar API belum dipasang.\nNanti akan diarahkan ke login Google"); }
</script>

</body>
</html>

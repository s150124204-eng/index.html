<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Bento Widget</title>

<!-- Google Font Nunito untuk kesan cute & bulat -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --text-main: #6d5061;
        --text-sub: #7f6573;
        --pink: #ffb6c9;
        --pink-button: #ff8db5;
        --white-glass: rgba(255, 255, 255, 0.4);
        --white-inner: rgba(255, 255, 255, 0.65);
        --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Nunito', system-ui, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Background gradien pastel bergerak lembut */
        background: linear-gradient(-45deg, #ffdce7, #ffeef4, #fff3ce, #e2f0ff);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        overflow: hidden;
        position: relative;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Frame Utama (Bento Grid) */
    .widget {
        width: 880px;
        height: 520px;
        border-radius: 40px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background: rgba(255,255,255,0.2);
        padding: 25px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        border: 2px solid rgba(255,255,255,0.5);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        z-index: 5;
        
        /* Animasi Pop-in saat halaman dibuka */
        opacity: 0;
        transform: translateY(20px) scale(0.98);
        animation: framePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
    }

    @keyframes framePop {
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Desain Card */
    .card {
        background: var(--white-glass);
        border-radius: 30px;
        padding: 25px;
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.6);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: translateY(-4px);
    }

    .title {
        font-weight: 800;
        margin-bottom: 15px;
        font-size: 20px;
        color: var(--text-main);
    }

    /* Kiri: Daily Widget */
    .daily-card {
        justify-content: space-between;
    }

    .clock {
        font-size: 75px;
        font-weight: 800;
        color: #553848;
        line-height: 1;
        letter-spacing: -2px;
    }

    .date {
        margin-top: 8px;
        color: var(--text-sub);
        font-weight: 600;
    }

    .weather {
        margin-top: 25px;
        padding: 18px;
        border-radius: 20px;
        background: var(--white-inner);
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }

    .temp {
        font-size: 45px;
        font-weight: 800;
        color: var(--text-main);
    }

    /* Kanan: Group Panel */
    .right-panel {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    /* Spotify Section */
    .spotify {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .album {
        width: 90px;
        height: 90px;
        border-radius: 22px;
        background: linear-gradient(135deg, #ffc8d8, #ff9ebc);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        box-shadow: 0 8px 15px rgba(255, 141, 181, 0.3);
        /* Animasi headphone melayang */
        animation: floatHeadphone 3s ease-in-out infinite alternate;
    }

    @keyframes floatHeadphone {
        0% { transform: translateY(0); }
        100% { transform: translateY(-6px); }
    }

    .song {
        font-size: 19px;
        font-weight: 700;
        color: var(--text-main);
    }

    .artist {
        margin-top: 4px;
        color: gray;
        font-size: 14px;
    }

    .loginButton {
        margin-top: 12px;
        padding: 10px 20px;
        border: none;
        border-radius: 50px;
        background: var(--pink-button);
        color: white;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        box-shadow: 0 4px 12px rgba(255, 141, 181, 0.4);
        transition: background 0.2s, transform 0.2s;
    }

    .loginButton:hover {
        background: #ff6c9c;
        transform: scale(1.03);
    }

    /* Calendar Section */
    .calendar-card {
        flex: 1;
        justify-content: space-between;
    }

    .calendar-content {
        height: 100px;
        overflow-y: auto;
    }

    .event {
        background: var(--white-inner);
        padding: 12px 15px;
        border-radius: 15px;
        margin-bottom: 5px;
    }

    .time {
        font-size: 12px;
        color: #ff6c9c;
        font-weight: 800;
    }

    .eventTitle {
        font-weight: 600;
        margin-top: 3px;
        font-size: 14px;
        color: var(--text-main);
    }

    /* --- DEKORASI ANIMASI PATRICK BERGERAK --- */
    .patrick-container {
        position: absolute;
        bottom: 20px;
        right: 40px;
        width: 150px;
        height: auto;
        z-index: 10;
        pointer-events: none; /* Biar tombol di bawahnya tetep bisa diklik */
        
        /* Animasi Gabungan: Melompat girang & Bergoyang halus */
        animation: patrickJump 4s ease-in-out infinite;
        filter: drop-shadow(0 10px 15px rgba(255, 141, 181, 0.25));
    }

    @keyframes patrickJump {
        0%, 100% {
            transform: translateY(0) scale(1) rotate(0deg);
        }
        30% {
            transform: translateY(-25px) scale(1.05) rotate(5deg); /* Melompat naik & miring dikit */
        }
        50% {
            transform: translateY(-10px) scale(0.98) rotate(-3deg);
        }
        70% {
            transform: translateY(-20px) scale(1.02) rotate(3deg);
        }
    }
</style>
</head>

<body>

<!-- Hiasan Patrick Menggunakan Animasi GIF Transparan yang Bergerak -->
<img src="https://media.tenor.com/images/3fa85994f71a48698544d6739fe100f9/tenor.gif" class="patrick-container" alt="Patrick Star">

<div class="widget">

    <!-- PANEL KIRI: Daily Widget (Sesuai Struktur Asli) -->
    <div class="card daily-card">
        <div>
            <div class="title">🌸 Daily Widget</div>
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">Loading...</div>
        </div>

        <div class="weather">
            <div class="temp">28°</div>
            <div style="font-weight: 700; color: var(--text-main); margin-top: 5px;">☀️ Surabaya</div>
        </div>
    </div>

    <!-- PANEL KANAN: Spotify & Google Calendar -->
    <div class="right-panel">
        
        <!-- Card Spotify (Sesuai Struktur Asli) -->
        <div class="card">
            <div class="title">🎵 Spotify</div>
            <div class="spotify">
                <div class="album">🎧</div>
                <div>
                    <div class="song" id="song">Belum terhubung</div>
                    <div class="artist" id="artist">Login Spotify dulu</div>
                    <button class="loginButton" onclick="spotifyLogin()">Connect Spotify</button>
                </div>
            </div>
        </div>

        <!-- Card Calendar -->
        <div class="card calendar-card">
            <div>
                <div class="title">📅 Google Calendar</div>
                <div class="calendar-content" id="calendar">
                    <div class="event">
                        <div class="time">09:00</div>
                        <div class="eventTitle">Belum ada kalender terhubung</div>
                    </div>
                </div>
            </div>
            <div style="text-align: right;">
                <button class="loginButton" onclick="googleLogin()">Connect Calendar</button>
            </div>
        </div>

    </div>

</div>

<script>
    // Fungsi Jam Realtime
    function updateClock(){
        let now = new Date();
        
        let time = now.toLocaleTimeString('id-ID', {
            hour: '2-digit',
            minute: '2-digit'
        }).replace('.', ':'); // Mengubah titik bawaan id-ID jadi titik dua (:)

        let date = now.toLocaleDateString('id-ID', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        document.getElementById('clock').innerText = time;
        document.getElementById('date').innerText = date;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Fungsi Trigger Login
    function spotifyLogin(){
        alert("Spotify API belum dipasang.\nNanti akan diarahkan ke login Spotify");
    }

    function googleLogin(){
        alert("Google Calendar API belum dipasang.\nNanti akan diarahkan ke login Google");
    }
</script>

</body>
</html>

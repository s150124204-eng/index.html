<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Widget Dashboard</title>

<!-- Font Nunito agar tulisan membulat dan lucu -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --pink: #ffb6c9;
        --pink2: #ffdce8;
        --text-main: #6d5061;
        --text-sub: #8c6e7f;
        --bg-card: rgba(255, 255, 255, 0.4);
        --bg-inner: rgba(255, 255, 255, 0.65);
        --shadow: 0 15px 35px rgba(255, 150, 180, 0.15);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Nunito', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Background gradient pastel yang bergerak */
        background: linear-gradient(-45deg, #ffdce7, #ffeef4, #fff3ce, #e6f2ff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        overflow: hidden;
        position: relative;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Container Utama (Bento Grid) */
    .widget {
        width: 850px; /* Ukuran pas, tidak kebesaran */
        height: 520px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 25px;
        box-shadow: var(--shadow);
        border: 2px solid rgba(255, 255, 255, 0.6);
        
        display: grid;
        grid-template-columns: 1fr 1.1fr; /* Kolom kanan sedikit lebih lebar */
        gap: 25px;
        z-index: 10;
        
        /* Animasi masuk */
        opacity: 0;
        transform: translateY(20px);
        animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
        to { opacity: 1; transform: translateY(0); }
    }

    /* Base Style untuk Card */
    .card {
        background: var(--bg-card);
        border-radius: 30px;
        padding: 25px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(255, 150, 180, 0.2);
    }

    .title {
        font-weight: 800;
        margin-bottom: 15px;
        font-size: 20px;
        color: var(--text-main);
    }

    /* --- Daily Widget (Kiri) --- */
    .daily-card {
        justify-content: space-between;
    }

    .clock {
        font-size: 75px;
        font-weight: 800;
        color: #553848;
        line-height: 1;
        letter-spacing: -2px;
    }

    .date {
        margin-top: 8px;
        color: var(--text-sub);
        font-weight: 600;
        font-size: 16px;
    }

    .weather {
        margin-top: auto; /* Mendorong cuaca ke bawah */
        padding: 20px;
        border-radius: 25px;
        background: var(--bg-inner);
        display: flex;
        align-items: center;
        gap: 20px;
        border: 1px solid rgba(255,255,255,0.8);
    }

    .temp {
        font-size: 45px;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1;
    }
    
    .weather-desc {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-sub);
    }

    /* --- Kolom Kanan (Spotify & Calendar) --- */
    .right-column {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    /* Spotify */
    .spotify {
        display: flex;
        gap: 20px;
        align-items: center;
        background: var(--bg-inner);
        padding: 15px;
        border-radius: 25px;
    }

    .album {
        width: 90px;
        height: 90px;
        border-radius: 20px;
        background: linear-gradient(135deg, #ffc8d8, #ff9ebc);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        box-shadow: 0 8px 15px rgba(255, 158, 188, 0.3);
        animation: float 3s ease-in-out infinite alternate;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
    }

    .song {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
    }

    .artist {
        margin-top: 4px;
        color: var(--text-sub);
        font-size: 14px;
        font-weight: 600;
    }

    /* Calendar */
    .calendar {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .event {
        background: var(--bg-inner);
        padding: 15px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: background 0.3s;
    }

    .event:hover {
        background: white;
    }

    .time {
        font-size: 13px;
        background: #ff8db5;
        color: white;
        padding: 5px 10px;
        border-radius: 10px;
        font-weight: 800;
    }

    .eventTitle {
        font-weight: 700;
        color: var(--text-main);
        font-size: 15px;
    }

    /* Buttons */
    .loginButton {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 50px;
        background: #ff8db5;
        color: white;
        cursor: pointer;
        font-weight: 800;
        font-size: 13px;
        box-shadow: 0 5px 15px rgba(255, 141, 181, 0.3);
        transition: all 0.3s ease;
    }

    .loginButton:hover {
        transform: scale(1.05);
        background: #ff6c9c;
    }

    .header-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .header-flex .title { margin-bottom: 0; }
    .header-flex .loginButton { margin-top: 0; }

    /* --- ANIMASI PATRICK STAR --- */
    .patrick-container {
        position: absolute;
        bottom: -20px; /* Sembunyi sedikit di bawah */
        right: 3%;
        width: 180px;
        z-index: 20;
        pointer-events: none; /* Supaya tidak mengganggu klik */
        /* Animasi mengambang dan bergoyang */
        animation: patrickDance 6s ease-in-out infinite;
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
    }

    @keyframes patrickDance {
        0% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-15px) rotate(5deg); }
        50% { transform: translateY(-5px) rotate(-3deg); }
        75% { transform: translateY(-20px) rotate(4deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }
</style>
</head>

<body>

<!-- Hiasan Patrick Star -->
<img src="https://upload.wikimedia.org/wikipedia/en/3/33/Patrick_Star.svg" class="patrick-container" alt="Patrick Star">

<div class="widget">

    <!-- BAGIAN KIRI: Daily Widget (Sama seperti aslinya) -->
    <div class="card daily-card">
        <div>
            <div class="title">🌸 Daily Widget</div>
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">Loading...</div>
        </div>

        <div class="weather">
            <div class="temp">28°</div>
            <div class="weather-desc">
                <div>☀️ Cerah</div>
                <div style="font-size: 14px; opacity: 0.8;">Surabaya</div>
            </div>
        </div>
    </div>


    <!-- BAGIAN KANAN: Spotify & Calendar -->
    <div class="right-column">

        <!-- Card Spotify (Sama seperti aslinya) -->
        <div class="card">
            <div class="title">🎵 Spotify</div>
            
            <div class="spotify">
                <div class="album">🎧</div>
                <div>
                    <div class="song" id="song">Belum terhubung</div>
                    <div class="artist" id="artist">Login Spotify dulu ya</div>
                    <button class="loginButton" onclick="spotifyLogin()">Connect Spotify</button>
                </div>
            </div>
        </div>

        <!-- Card Calendar -->
        <div class="card" style="flex: 1;">
            <div class="header-flex">
                <div class="title">📅 Google Calendar</div>
                <button class="loginButton" onclick="googleLogin()">Sync</button>
            </div>
            
            <div class="calendar" id="calendar">
                <div class="event">
                    <div class="time">09:00</div>
                    <div class="eventTitle">Belum ada kalender terhubung</div>
                </div>
            </div>
        </div>

    </div>

</div>

<script>
    // Fungsi Update Jam
    function updateClock(){
        let now = new Date();

        // Format waktu (mengganti titik dengan titik dua)
        let time = now.toLocaleTimeString('id-ID', {
            hour: '2-digit',
            minute: '2-digit'
        }).replace('.', ':'); 

        let date = now.toLocaleDateString('id-ID', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        document.getElementById('clock').innerText = time;
        document.getElementById('date').innerText = date;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Fungsi Alert
    function spotifyLogin(){
        alert("✨ Spotify API belum dipasang.\nNanti akan diarahkan ke login Spotify.");
    }

    function googleLogin(){
        alert("✨ Google Calendar API belum dipasang.\nNanti akan diarahkan ke login Google.");
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Widget Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --text-main: #5c414f;
        --text-sub: #9a7b8a;
        --accent: #ff8fb5;
        --bg-card: rgba(255, 255, 255, 0.55);
        --border-card: rgba(255, 255, 255, 0.8);
        --shadow-card: 0 15px 35px rgba(255, 150, 180, 0.15);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Nunito', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Animated gradient background */
        background: linear-gradient(-45deg, #ffdce7, #ffeef4, #fff3ce, #e2f0ff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        overflow: hidden;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Bento Grid Dashboard */
    .dashboard {
        display: grid;
        grid-template-columns: 320px 450px;
        grid-template-rows: auto auto;
        gap: 25px;
        padding: 20px;
    }

    /* Base Card Style */
    .card {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 35px;
        padding: 25px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--shadow-card);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        /* Animation setup */
        opacity: 0;
        transform: translateY(30px) scale(0.9);
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .card:hover {
        transform: translateY(-5px) scale(1.02) !important; /* Overrides initial transform after load */
    }

    /* Animation Delays for Staggered Effect */
    .card:nth-child(1) { animation-delay: 0.1s; grid-column: 1; grid-row: 1; }
    .card:nth-child(2) { animation-delay: 0.2s; grid-column: 2; grid-row: 1; }
    .card:nth-child(3) { animation-delay: 0.3s; grid-column: 1; grid-row: 2; }
    .card:nth-child(4) { animation-delay: 0.4s; grid-column: 2; grid-row: 2; }

    @keyframes popIn {
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .title {
        font-weight: 800;
        font-size: 18px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* --- Clock & Date Card --- */
    .clock-container {
        text-align: center;
        padding: 10px 0;
    }
    .clock {
        font-size: 75px;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1;
        letter-spacing: -2px;
    }
    .date {
        margin-top: 5px;
        color: var(--text-sub);
        font-weight: 600;
        font-size: 16px;
    }

    /* --- Spotify Card --- */
    .spotify-content {
        display: flex;
        align-items: center;
        gap: 20px;
        background: rgba(255,255,255,0.6);
        padding: 15px;
        border-radius: 25px;
    }
    .album {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: linear-gradient(135deg, #ffc8d8, #ff9ebc);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        box-shadow: 0 8px 20px rgba(255, 158, 188, 0.4);
        animation: float 4s ease-in-out infinite;
    }
    .song-info {
        flex: 1;
    }
    .song {
        font-size: 19px;
        font-weight: 800;
        color: var(--text-main);
    }
    .artist {
        color: var(--text-sub);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    /* --- Weather Card --- */
    .weather-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 10px 0;
    }
    .weather-icon {
        font-size: 65px;
        animation: float 3s ease-in-out infinite alternate;
    }
    .weather-info {
        display: flex;
        flex-direction: column;
    }
    .temp {
        font-size: 45px;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1;
    }
    .location {
        color: var(--text-sub);
        font-weight: 700;
        font-size: 16px;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    /* --- Calendar Card --- */
    .calendar-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .event {
        background: rgba(255,255,255,0.7);
        padding: 15px 20px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: background 0.3s ease;
    }
    .event:hover {
        background: white;
    }
    .time-badge {
        background: var(--accent);
        color: white;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 800;
    }
    .eventTitle {
        font-weight: 700;
        color: var(--text-main);
        font-size: 15px;
    }

    /* --- Buttons --- */
    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 50px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        box-shadow: 0 5px 15px rgba(255, 141, 181, 0.4);
        transition: all 0.3s ease;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 141, 181, 0.6);
        background: #ff7aa8;
    }
</style>
</head>

<body>

<div class="dashboard">

    <!-- CARD 1: Time & Date -->
    <div class="card" style="display: flex; flex-direction: column; justify-content: center;">
        <div class="title" style="justify-content: center; margin-bottom: 10px;">🌸 Hari Ini</div>
        <div class="clock-container">
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">Memuat...</div>
        </div>
    </div>

    <!-- CARD 2: Spotify -->
    <div class="card">
        <div class="card-header">
            <div class="title">🎵 Sedang Diputar</div>
        </div>
        <div class="spotify-content">
            <div class="album">🎧</div>
            <div class="song-info">
                <div class="song" id="song">Belum terhubung</div>
                <div class="artist" id="artist">Login Spotify dulu ya</div>
                <button class="btn" onclick="spotifyLogin()">Connect Spotify</button>
            </div>
        </div>
    </div>

    <!-- CARD 3: Weather -->
    <div class="card" style="display: flex; flex-direction: column; justify-content: center;">
        <div class="title" style="justify-content: center;">☁️ Cuaca</div>
        <div class="weather-content">
            <div class="weather-icon">🌤️</div>
            <div class="weather-info">
                <div class="temp">28°</div>
                <div class="location">Surabaya</div>
            </div>
        </div>
    </div>

    <!-- CARD 4: Calendar -->
    <div class="card">
        <div class="card-header">
            <div class="title">📅 Jadwal Kamu</div>
            <button class="btn" onclick="googleLogin()">Sync</button>
        </div>
        <div class="calendar-content">
            <div class="event">
                <div class="time-badge">09:00</div>
                <div class="eventTitle">Belum ada jadwal hari ini</div>
            </div>
            <div class="event">
                <div class="time-badge">14:30</div>
                <div class="eventTitle">Hubungkan kalender dulu</div>
            </div>
        </div>
    </div>

</div>

<script>
    // Fungsi Update Jam
    function updateClock() {
        let now = new Date();
        
        let time = now.toLocaleTimeString('id-ID', {
            hour: '2-digit',
            minute: '2-digit'
        }).replace('.', ':'); // Menyesuaikan format waktu lokal

        let date = now.toLocaleDateString('id-ID', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        document.getElementById('clock').innerText = time;
        document.getElementById('date').innerText = date;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Fungsi Tombol
    function spotifyLogin() {
        alert("✨ Spotify API belum dipasang.\nNanti akan diarahkan ke login Spotify.");
    }

    function googleLogin() {
        alert("✨ Google Calendar API belum dipasang.\nNanti akan diarahkan ke login Google.");
    }
</script>

</body>
</html>
